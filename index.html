<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111114">
  <meta name="description" content="Search, stream and download free, legal music. No account, no subscription.">
  <title>Music is Life</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 class="brand"><img src="icon.svg" alt="" width="28" height="28"> Music is Life</h1>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="search" role="tab">Discover</button>
      <button class="tab" data-view="library" role="tab">My Library <span id="lib-count" class="badge"></span></button>
    </nav>
  </header>

  <main>
    <section id="view-search" class="view">
      <form id="search-form" class="search">
        <input id="q" type="search" placeholder="Search artists, albums, genres…" autocomplete="off" aria-label="Search">
        <select id="source" aria-label="Source">
          <option value="all">All free music</option>
          <option value="cc">Creative Commons</option>
          <option value="live">Live concerts</option>
          <option value="netlabels">Netlabel releases</option>
          <option value="78s">Vintage 78rpm records</option>
        </select>
        <button type="submit" class="btn primary">Search</button>
      </form>
      <div class="chips" id="chips"></div>
      <p id="status" class="status" role="status"></p>
      <div id="results" class="grid"></div>
      <button id="more" class="btn more" hidden>Load more</button>
    </section>

    <section id="view-album" class="view" hidden>
      <button id="back" class="btn ghost">← Back</button>
      <div id="album"></div>
    </section>

    <section id="view-library" class="view" hidden>
      <p class="hint">Tracks saved here play offline inside the app. Use ⬇ to save a copy to your device's Downloads.</p>
      <div id="library"></div>
    </section>
  </main>

  <footer class="player" id="player" hidden>
    <div class="now">
      <img id="now-art" alt="">
      <div class="now-text">
        <strong id="now-title"></strong>
        <span id="now-artist"></span>
      </div>
    </div>
    <audio id="audio" controls preload="none"></audio>
  </footer>

  <div id="toast" class="toast" role="alert" hidden></div>

  <script src="app.js"></script>
</body>
</html>
